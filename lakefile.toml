name = "hadamard_multibase"
version = "0.1.0"
defaultTargets = ["HadamardMultibase", "HadamardMultibaseComplete", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "HadamardMultibase"

[[lean_lib]]
name = "OAI"
srcDir = "vendor/logarithms"
