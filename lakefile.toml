[[lean_lib]]
name = "QuadraticPi"
srcDir = "vendor/logarithms"
moreLeanArgs = ["-j2"]

[[lean_lib]]
name = "integration"

[[lean_lib]]
name = "HadamardMultibaseComplete"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
